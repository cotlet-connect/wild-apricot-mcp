[project]
name = "wild-apricot-mcp"
version = "1.1.0"
description = "Connect Wild Apricot to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Wild Apricot API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["wild apricot", "wild apricot api", "wild apricot mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/wild-apricot-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=wild-apricot"
Source = "https://github.com/cotlet-connect/wild-apricot-mcp"

[project.scripts]
wild-apricot-mcp = "wild_apricot_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"wild_apricot_agent.py" = "wild_apricot_agent.py"

[tool.hatch.build.targets.sdist]
include = ["wild_apricot_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
